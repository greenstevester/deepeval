services:
  # DeepEval test runner (connects to external Ollama)
  deepeval:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepeval-tests
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - DEEPEVAL_TELEMETRY_OPT_OUT=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./test_results:/app/test_results
      - ./test_local_llm.py:/app/test_local_llm.py
      - ./test_local_simple.py:/app/test_local_simple.py
      - ./examples:/app/examples
    command: ["deepeval", "test", "run", "test_local_llm.py", "-v"]
    profiles:
      - test

  # Interactive shell for development
  deepeval-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepeval-dev
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - DEEPEVAL_TELEMETRY_OPT_OUT=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    profiles:
      - dev
